# Configuration for BLE Motor Controller
# Zephyr SDK v2.5.1

# Enable console and UART for serial output
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# GPIO and PWM for motors
CONFIG_GPIO=y
CONFIG_PWM=y

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BT_PERIPHERAL=y

# System configuration
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ====================================
# Bluetooth Configuration
# ====================================

# Enable Bluetooth
CONFIG_BT=y

# Enable Bluetooth central role (scanner/initiator)
CONFIG_BT_CENTRAL=y

# Bluetooth device name
CONFIG_BT_DEVICE_NAME="Motor_Receiver"

# Maximum number of simultaneous connections
CONFIG_BT_MAX_CONN=1

# Enable GATT client (needed for subscribing to notifications)
CONFIG_BT_GATT_CLIENT=y

# Bluetooth buffer configuration
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=70
CONFIG_BT_BUF_ACL_TX_SIZE=27

# ATT settings
CONFIG_BT_ATT_PREPARE_COUNT=2

# Enable Bluetooth debugging (optional)
# CONFIG_BT_DEBUG_LOG=y
# CONFIG_BT_DEBUG_GATT=y
# CONFIG_BT_DEBUG_HCI_CORE=y